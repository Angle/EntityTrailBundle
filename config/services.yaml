services:
    _defaults:
        autowire: false
        autoconfigure: false
        public: false

    # ---------------------------------------------------------------------
    # Core listener — writes audit rows on postFlush via raw DBAL insert.
    # ---------------------------------------------------------------------
    Angle\EntityTrailBundle\EventListener\EntityTrailListener:
        arguments:
            $config: '%angle_entity_trail.config%'
            $userProvider: '@angle_entity_trail.user_provider'
        tags:
            - { name: doctrine.event_listener, event: onFlush }
            - { name: doctrine.event_listener, event: preUpdate }
            - { name: doctrine.event_listener, event: postUpdate }
            - { name: doctrine.event_listener, event: postPersist }
            - { name: doctrine.event_listener, event: preRemove }
            - { name: doctrine.event_listener, event: postFlush }

    # ---------------------------------------------------------------------
    # User provider (default implementation + overridable alias).
    # ---------------------------------------------------------------------
    Angle\EntityTrailBundle\Service\SecurityEntityTrailUserProvider:
        arguments:
            $tokenStorage: '@security.token_storage'
            $requestStack: '@request_stack'

    angle_entity_trail.user_provider:
        alias: Angle\EntityTrailBundle\Service\SecurityEntityTrailUserProvider
        public: true

    # ---------------------------------------------------------------------
    # Repository.
    # ---------------------------------------------------------------------
    Angle\EntityTrailBundle\Repository\EntityTrailLogRepository:
        arguments:
            $registry: '@doctrine'
        tags:
            - { name: doctrine.repository_service }

    # ---------------------------------------------------------------------
    # Admin controllers (removed by the extension when enable_admin: false).
    # ---------------------------------------------------------------------
    Angle\EntityTrailBundle\Controller\EntityTrailLogController:
        arguments:
            $twig: '@twig'
            $repository: '@Angle\EntityTrailBundle\Repository\EntityTrailLogRepository'
            $config: '%angle_entity_trail.config%'
        tags:
            - { name: controller.service_arguments }

    Angle\EntityTrailBundle\Controller\Ajax\EntityTrailLogController:
        arguments:
            $repository: '@Angle\EntityTrailBundle\Repository\EntityTrailLogRepository'
            $urlGenerator: '@router'
        tags:
            - { name: controller.service_arguments }
